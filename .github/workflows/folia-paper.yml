name: Folia recorder and Paper playback
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :folia-replay:build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedReplay-FoliaPaper
          path: folia-replay/build/libs/AdvancedReplay-FoliaPaper.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-test-results
          path: folia-replay/build/reports/tests/test
